name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run check
      - run: npm test
      # GitHub Actions runners ship Google Chrome, which matches the
      # `channel: "chrome"` setting in playwright.config.ts.
      - run: npm run test:browser
      - run: npm run build
